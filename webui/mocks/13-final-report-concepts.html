<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenWhisper — Final Report Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Focus Stage tokens — extended from webui/src/styles.css so the report
   reads as the same product as the live dashboard.
   Two accents only: leaf (settled) and clay (needs attention).
   ========================================================================== */
:root {
  color-scheme: light;
  --ink: #1a2420;
  --ink-2: #24302b;
  --soft: #5b6b63;
  --faint: #8a988f;
  --leaf: #2f6b4f;
  --leaf-2: #3f8a66;
  --clay: #a2603c;
  --clay-soft: rgba(162, 96, 60, 0.10);
  --wash: #e8f0ea;
  --paper: #f7faf8;
  --line: #c9d5cd;
  --hair: rgba(26, 36, 32, 0.09);
  --hair-2: rgba(26, 36, 32, 0.16);
  --radius: 22px;
  --radius-sm: 14px;
  --font: 'DM Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 72px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; min-height: 100%;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  background:
    radial-gradient(1200px 600px at 50% -20%, #d5e8db 0%, transparent 60%),
    linear-gradient(165deg, #f3f7f4 0%, #e4ece7 45%, #f7faf8 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

body { padding-bottom: 108px; }

/* ---------- shared primitives ---------- */

.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
}

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.serif { font-family: var(--font-display); font-weight: 400; }

button {
  font: inherit; cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 15px;
  background: rgba(255,255,255,0.7);
  color: var(--ink);
  transition: background .15s, border-color .15s, color .15s;
}
button:hover { background: var(--wash); border-color: color-mix(in srgb, var(--leaf) 35%, var(--line)); }
button.solid { background: var(--leaf); border-color: var(--leaf); color: #fff; font-weight: 600; }
button.solid:hover { background: var(--leaf-2); border-color: var(--leaf-2); }

/* Timestamp reference. Deliberately quiet — it is punctuation, not a badge. */
.t {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  color: var(--leaf);
  background: none;
  border: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--leaf) 30%, transparent);
  border-radius: 0;
  padding: 0 1px;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.t:hover { background: color-mix(in srgb, var(--leaf) 12%, transparent); border-color: var(--leaf); }
.t.playing { background: var(--leaf); color: #fff; border-color: var(--leaf); }

.t-group { display: inline-flex; gap: 6px; align-items: baseline; }

/* ---------- app chrome ---------- */

.topbar {
  position: sticky; top: 0; z-index: 60;
  backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--paper) 78%, transparent);
  border-bottom: 1px solid var(--hair);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark {
  font-family: var(--font-display); font-size: 21px; color: var(--ink);
}
.brand-sub { font-size: 12.5px; color: var(--soft); }

.tabs {
  max-width: 1180px; margin: 0 auto;
  padding: 0 24px;
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--hair);
}
.tab {
  border: 0; background: none; border-radius: 0;
  padding: 12px 14px 11px;
  font-size: 14px; font-weight: 500;
  color: var(--soft);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { background: none; color: var(--ink); }
.tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--leaf); }
.tab-note {
  max-width: 1180px; margin: 0 auto; padding: 10px 24px 0;
  font-size: 13px; color: var(--soft);
}
.tab-note em { font-style: italic; color: var(--faint); }

.stage { max-width: 1180px; margin: 0 auto; padding: 20px 24px 40px; }

.view { display: none; }
.view.active { display: block; animation: rise .28s cubic-bezier(.16,1,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.sheet {
  background: color-mix(in srgb, var(--paper) 92%, white);
  border: 1px solid var(--hair);
  border-radius: var(--radius);
  box-shadow: 0 1px 2px rgba(26,36,32,.03), 0 18px 46px -28px rgba(26,36,32,.30);
}

/* ==========================================================================
   1. RIBBON — the meeting as a proportional timeline you can walk
   ========================================================================== */

.ribbon { padding: 40px 44px 44px; }

.rb-head { margin-bottom: 30px; }
.rb-title {
  font-family: var(--font-display);
  font-size: 40px; line-height: 1.12; letter-spacing: -0.01em;
  margin: 8px 0 12px; max-width: 20ch;
}
.rb-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--soft); }
.rb-meta b { font-weight: 600; color: var(--ink); }

/* --- the minimap: real proportional shape of the meeting --- */
.minimap { margin: 26px 0 6px; }
.mm-track {
  position: relative; height: 78px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--wash) 70%, white);
  border: 1px solid var(--hair);
  overflow: hidden;
}
.mm-seg {
  position: absolute; bottom: 0;
  border-radius: 1px 1px 0 0;
  opacity: .5;
}
.mm-marker {
  position: absolute; top: 0; bottom: 0; width: 2px;
  transform: translateX(-1px);
  cursor: pointer;
}
.mm-marker::after {
  content: ''; position: absolute; top: 7px; left: -4px;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--paper) 92%, white);
}
.mm-marker.decisions { background: color-mix(in srgb, var(--leaf) 55%, transparent); }
.mm-marker.decisions::after { background: var(--leaf); }
.mm-marker.risks { background: color-mix(in srgb, var(--clay) 55%, transparent); }
.mm-marker.risks::after { background: var(--clay); }
.mm-marker.action_items { background: color-mix(in srgb, var(--ink) 30%, transparent); }
.mm-marker.action_items::after { background: var(--ink); }
.mm-marker:hover { width: 3px; }
.mm-playhead {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--ink); opacity: .75; pointer-events: none;
  transition: left .2s linear;
}
.mm-axis {
  display: flex; justify-content: space-between;
  margin-top: 6px; font-size: 10.5px; color: var(--faint);
  font-family: var(--font-mono);
}
.mm-legend {
  display: flex; gap: 16px; margin-top: 10px;
  font-size: 11.5px; color: var(--soft);
}
.mm-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mm-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* --- the walk --- */
.rb-flow { margin-top: 40px; }

.rb-row {
  display: grid;
  grid-template-columns: 62px 1px 1fr;
  gap: 0 22px;
  position: relative;
}
.rb-time {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--faint); text-align: right;
  padding-top: 2px;
}
.rb-rail { background: var(--hair); position: relative; }
.rb-row:first-child .rb-rail { background: linear-gradient(var(--paper), var(--hair) 22px); }
.rb-row:last-child .rb-rail { background: linear-gradient(var(--hair), transparent); }
.rb-dot {
  position: absolute; left: 50%; top: 6px;
  width: 9px; height: 9px; border-radius: 50%;
  transform: translateX(-50%);
  background: var(--paper);
  border: 2px solid var(--line);
}
.rb-body { padding-bottom: 34px; min-width: 0; }

.rb-beat {
  font-family: var(--font-display);
  font-size: 23px; line-height: 1.25;
  margin: 0 0 10px;
  max-width: 30ch;
}
.rb-note { font-size: 14.5px; color: var(--soft); max-width: 66ch; margin: 0 0 14px; }

.rb-cut {
  border-left: 2px solid var(--line);
  padding: 2px 0 2px 16px;
  margin: 0 0 12px;
  max-width: 62ch;
}
.rb-cut p { margin: 0 0 4px; font-size: 14.5px; }
.rb-cut.settled { border-color: var(--leaf); }
.rb-cut.watch { border-color: var(--clay); }
.rb-cut.owed { border-color: var(--ink); }
.rb-cut .rb-cut-kind {
  font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  color: var(--faint); display: block; margin-bottom: 4px;
}
.rb-cut.settled .rb-cut-kind { color: var(--leaf); }
.rb-cut.watch .rb-cut-kind { color: var(--clay); }
.rb-owner { font-size: 12.5px; color: var(--soft); }
.rb-owner b { color: var(--ink); font-weight: 600; }

/* ==========================================================================
   2. BRIEF — an editorial page. No cards, no badges, no boxes.
   ========================================================================== */

.brief {
  padding: 64px 0 72px;
  max-width: 720px; margin: 0 auto;
}
.brief-inner { padding: 0 40px; }

.br-rule { border: 0; border-top: 1px solid var(--hair-2); margin: 40px 0; }
.br-rule.thin { border-top: 1px solid var(--hair); margin: 26px 0; }

.br-kicker { margin-bottom: 14px; }
.br-title {
  font-family: var(--font-display);
  font-size: 48px; line-height: 1.08; letter-spacing: -0.015em;
  margin: 0 0 18px;
}
.br-byline {
  font-size: 12.5px; color: var(--soft);
  padding-bottom: 22px; border-bottom: 2px solid var(--ink);
}
.br-byline b { color: var(--ink); font-weight: 600; }

.br-lede {
  font-size: 18.5px; line-height: 1.62; color: var(--ink-2);
  margin: 26px 0 0;
}
.br-lede::first-letter {
  font-family: var(--font-display);
  float: left; font-size: 62px; line-height: .82;
  padding: 6px 10px 0 0; color: var(--leaf);
}
.br-lede + p { font-size: 16.5px; line-height: 1.65; color: var(--ink-2); margin: 16px 0 0; }

.br-h {
  font-family: var(--font-display);
  font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--soft); margin: 0 0 20px; font-weight: 400;
}

.br-list { counter-reset: br; margin: 0; padding: 0; list-style: none; }
.br-list > li {
  counter-increment: br;
  position: relative;
  padding-left: 44px;
  margin-bottom: 24px;
}
.br-list > li::before {
  content: counter(br, decimal-leading-zero);
  position: absolute; left: 0; top: 2px;
  font-family: var(--font-mono); font-size: 12px;
  color: var(--faint);
}
.br-statement {
  font-family: var(--font-display);
  font-size: 21px; line-height: 1.34;
  margin: 0 0 5px;
}
.br-sub { font-size: 13.5px; color: var(--soft); margin: 0; }

.br-owed { list-style: none; margin: 0; padding: 0; }
.br-owed li {
  display: grid; grid-template-columns: 108px 1fr; gap: 18px;
  padding: 13px 0; border-top: 1px solid var(--hair);
  align-items: baseline;
}
.br-owed li:last-child { border-bottom: 1px solid var(--hair); }
.br-who {
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--leaf);
}
.br-what { font-size: 15.5px; line-height: 1.5; }

.br-open { margin: 0; padding: 0; list-style: none; }
.br-open li { margin-bottom: 18px; padding-left: 20px; border-left: 2px solid var(--clay); }
.br-open p { margin: 0; }
.br-q { font-size: 16px; line-height: 1.45; }
.br-a { font-size: 13.5px; color: var(--soft); margin-top: 4px !important; }

.br-foot {
  margin-top: 46px; padding-top: 20px; border-top: 1px solid var(--hair);
  font-size: 12px; color: var(--faint); line-height: 1.6;
}

/* ==========================================================================
   3. LEDGER — every claim beside the words that produced it
   ========================================================================== */

.ledger { padding: 40px 44px 48px; }

.lg-head { max-width: 62ch; margin-bottom: 34px; }
.lg-head h1 {
  font-family: var(--font-display); font-size: 34px; line-height: 1.15;
  margin: 8px 0 10px;
}
.lg-head p { font-size: 14.5px; color: var(--soft); margin: 0; }

.lg-group { margin-bottom: 42px; }
.lg-group-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; padding-bottom: 10px; margin-bottom: 4px;
  border-bottom: 1px solid var(--hair-2);
}
.lg-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); }

.lg-entry {
  display: grid; grid-template-columns: 1.05fr 1fr; gap: 0 44px;
  padding: 26px 0; border-bottom: 1px solid var(--hair);
  align-items: start;
}
.lg-entry:last-child { border-bottom: 0; }

.lg-claim { min-width: 0; }
.lg-claim p {
  font-family: var(--font-display);
  font-size: 19px; line-height: 1.36; margin: 0 0 8px;
}
.lg-claim .lg-tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lg-tag {
  font-size: 11px; font-weight: 600; letter-spacing: .05em;
  color: var(--soft);
  background: var(--wash); border: 1px solid var(--hair);
  border-radius: 999px; padding: 2px 9px;
}
.lg-tag.high { color: var(--clay); background: var(--clay-soft); border-color: color-mix(in srgb, var(--clay) 25%, transparent); }
.lg-tag.owner { color: var(--leaf); background: color-mix(in srgb, var(--leaf) 8%, transparent); border-color: color-mix(in srgb, var(--leaf) 22%, transparent); }

.lg-source { min-width: 0; }
.lg-quote {
  border-left: 2px solid var(--line);
  padding: 0 0 0 16px; margin: 0 0 12px;
}
.lg-quote:last-child { margin-bottom: 0; }
.lg-quote .lg-attr {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint); font-weight: 600; margin-bottom: 3px;
}
.lg-quote blockquote {
  margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-2);
}
.lg-quote blockquote::before { content: '\201C'; }
.lg-quote blockquote::after { content: '\201D'; }
.lg-quote.active { border-color: var(--leaf); }
.lg-quote.active blockquote { color: var(--ink); }

.lg-unsourced {
  font-size: 13px; color: var(--faint); font-style: italic;
  border-left: 2px dashed var(--line); padding-left: 16px;
}

/* ==========================================================================
   4. SIGNAL — one screen, no scrolling, for the person who missed it
   ========================================================================== */

.signal { padding: 32px 44px 30px; }

.sg-top {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 20px; flex-wrap: wrap; margin-bottom: 14px;
}
.sg-when { font-size: 12.5px; color: var(--soft); }

.sg-headline {
  font-family: var(--font-display);
  font-size: clamp(29px, 3.1vw, 40px);
  line-height: 1.14; letter-spacing: -0.012em;
  margin: 0 0 8px; max-width: 26ch;
}
.sg-headline .hl { color: var(--leaf); font-style: italic; }
.sg-standfirst {
  font-size: 15.5px; line-height: 1.5; color: var(--soft);
  max-width: 62ch; margin: 0 0 24px;
}

.sg-cols {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0; border-top: 2px solid var(--ink);
}
.sg-col { padding: 16px 26px 4px 0; }
.sg-col + .sg-col { border-left: 1px solid var(--hair); padding-left: 26px; }
.sg-col-head {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 13px;
}
.sg-col-head h3 {
  font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  margin: 0; color: var(--ink);
}
.sg-n {
  font-family: var(--font-mono); font-size: 11px; color: var(--faint);
}
.sg-col.watch .sg-col-head h3 { color: var(--clay); }
.sg-col ul { list-style: none; margin: 0; padding: 0; }
.sg-col li { margin-bottom: 12px; font-size: 14px; line-height: 1.42; }
.sg-col li .sg-meta { display: block; font-size: 12px; color: var(--faint); margin-top: 3px; }
.sg-col li .sg-meta b { color: var(--leaf); font-weight: 600; }

.sg-listen {
  margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--hair-2);
}
.sg-listen h3 {
  font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  margin: 0 0 12px; color: var(--soft);
}
.sg-picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.sg-pick {
  border: 1px solid var(--hair); border-radius: var(--radius-sm);
  padding: 12px 14px; background: rgba(255,255,255,.55);
  cursor: pointer; text-align: left;
  transition: border-color .15s, background .15s;
}
.sg-pick:hover { border-color: var(--leaf); background: rgba(255,255,255,.9); }
.sg-pick .sg-pick-t {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--leaf);
  display: block; margin-bottom: 6px;
}
.sg-pick .sg-pick-q { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }

/* ==========================================================================
   5. LANES — who spoke, who committed, who was quiet
   ========================================================================== */

.lanes { padding: 40px 44px 44px; }
.ln-head { margin-bottom: 30px; }
.ln-head h1 { font-family: var(--font-display); font-size: 34px; margin: 8px 0 10px; }
.ln-head p { font-size: 14.5px; color: var(--soft); margin: 0; max-width: 62ch; }

.ln-axis {
  display: grid; grid-template-columns: 208px 1fr; gap: 24px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--faint);
  padding-bottom: 6px; border-bottom: 1px solid var(--hair);
}
.ln-axis-ticks { display: flex; justify-content: space-between; }

.lane {
  display: grid; grid-template-columns: 208px 1fr; gap: 24px;
  padding: 20px 0; border-bottom: 1px solid var(--hair);
  align-items: start;
}
.ln-person { display: flex; gap: 12px; align-items: flex-start; }
.ln-avatar {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 17px; color: #fff;
  margin-top: 2px;
}
.ln-name { font-size: 15.5px; font-weight: 600; line-height: 1.25; }
.ln-role { font-size: 11.5px; color: var(--faint); }
.ln-share {
  margin-top: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--soft);
}
.ln-bar { height: 3px; border-radius: 2px; background: var(--hair); margin-top: 4px; width: 128px; }
.ln-bar i { display: block; height: 100%; border-radius: 2px; }

.ln-right { min-width: 0; }
.ln-strip {
  position: relative; height: 22px; margin-bottom: 14px;
  border-radius: 4px; background: color-mix(in srgb, var(--wash) 62%, white);
  overflow: hidden;
}
.ln-strip i { position: absolute; top: 0; bottom: 0; border-radius: 1px; opacity: .62; }
.ln-commits { list-style: none; margin: 0; padding: 0; }
.ln-commits li {
  display: flex; gap: 10px; align-items: baseline;
  font-size: 14.5px; line-height: 1.45; margin-bottom: 8px;
}
.ln-kind {
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--faint); flex: none; width: 62px; padding-top: 3px;
}
.ln-kind.owed { color: var(--ink); }
.ln-kind.settled { color: var(--leaf); }
.ln-quiet { font-size: 13.5px; color: var(--faint); font-style: italic; }

/* ==========================================================================
   Scrubber — the report is playable. Any timestamp anywhere lands here.
   ========================================================================== */

.scrubber {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--hair-2);
}
.sc-inner {
  max-width: 1180px; margin: 0 auto; padding: 12px 24px 14px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
}
.sc-play {
  width: 40px; height: 40px; border-radius: 50%; padding: 0;
  display: grid; place-items: center;
  background: var(--leaf); border-color: var(--leaf); color: #fff;
  font-size: 14px;
}
.sc-play:hover { background: var(--leaf-2); border-color: var(--leaf-2); }
.sc-mid { min-width: 0; }
.sc-line {
  font-size: 13.5px; line-height: 1.4; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sc-line b { color: var(--leaf); font-weight: 600; }
.sc-line .sc-idle { color: var(--faint); }
.sc-track {

const DURATION = 2304; // max segment end_s, same rule the markdown exporter uses
const SEG = Object.fromEntries(DATA.segments.map((s) => [s.id, s]));
const P = DATA.state.participants;

const SPEAKER_COLOR = {

  p_jordan: '#8a7340',

const clock = (s) => {
  const t = Math.max(0, Math.round(s));
  const m = Math.floor(t / 60);
  return `${m}:${String(t % 60).padStart(2, '0')}`;
};

const who = (pid) => (pid && P[pid] ? P[pid].display_name : 'Unknown');

/** Item time: explicit data.start_s, else the earliest cited segment. */
function itemTime(item) {
  if (typeof item.data?.start_s === 'number') return item.data.start_s;
  const times = (item.evidence || []).map((id) => SEG[id]?.start_s).filter((n) => typeof n === 'number');
  return times.length ? Math.min(...times) : null;
}

const esc = (s) =>
  String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Render evidence ids as quiet, clickable timestamps. */
function chips(evidence, limit) {
  const ids = (evidence || []).filter((id) => SEG[id]).slice(0, limit || 4);
  if (!ids.length) return '';
  return `<span class="t-group">${ids
    .map((id) => `<button class="t" data-seg="${id}" onclick="goto('${id}')">${clock(SEG[id].start_s)}</button>`)
    .join('')}</span>`;
}

const byTime = (a, b) => (itemTime(a) ?? 1e9) - (itemTime(b) ?? 1e9);

/* Talk time per participant, from segment durations. */
const talk = {};
DATA.segments.forEach((s) => {
  const d = s.end_s - s.start_s;
  talk[s.speaker_participant_id] = (talk[s.speaker_participant_id] || 0) + d;
});
const talkTotal = Object.values(talk).reduce((a, b) => a + b, 0);

/* ============================================================================
   VIEW 1 — RIBBON
   The meeting rendered against its own clock. A proportional minimap shows
   the real shape of the conversation (who spoke, when things were settled),
   then you walk the beats in order. Built on timeline.data.start_s.
   ============================================================================ */

function renderRibbon() {
  const S = DATA.state;

  const segBars = DATA.segments
    .map((s) => {
      const left = (s.start_s / DURATION) * 100;
      const w = Math.max(0.35, ((s.end_s - s.start_s) / DURATION) * 100);
      const h = 18 + Math.min(40, (s.end_s - s.start_s) * 1.9);
      return `<i class="mm-seg" style="left:${left}%;width:${w}%;height:${h}px;background:${
        SPEAKER_COLOR[s.speaker_participant_id]
      }"></i>`;
    })
    .join('');

  const markerFor = (item, card) => {
    const t = itemTime(item);
    if (t == null) return '';
    return `<span class="mm-marker ${card}" style="left:${(t / DURATION) * 100}%" title="${esc(
      item.text
    )}" onclick="seek(${t})"></span>`;
  };
  const markers = [
    ...S.cards.decisions.map((i) => markerFor(i, 'decisions')),
    ...S.cards.risks.map((i) => markerFor(i, 'risks')),
    ...S.cards.action_items.map((i) => markerFor(i, 'action_items')),
  ].join('');

  const ticks = [0, 0.25, 0.5, 0.75, 1]
    .map((f) => `<span>${clock(DURATION * f)}</span>`)
    .join('');

  /* Beats are the timeline card. Everything else attaches to the nearest beat
     that starts at or before it, so the walk stays chronological. */
  const beats = [...S.cards.timeline].sort(byTime);
  const attach = (item, kind) => ({ item, kind, t: itemTime(item) });
  const extras = [
    ...S.cards.decisions.map((i) => attach(i, 'settled')),
    ...S.cards.risks.map((i) => attach(i, 'watch')),
    ...S.cards.action_items.map((i) => attach(i, 'owed')),
  ].filter((e) => e.t != null);

  const noteFor = (t) => {
    const n = S.cards.live_notes.filter((x) => itemTime(x) <= t).pop();
    return n && Math.abs(itemTime(n) - t) < 60 ? n : null;
  };

  const rows = beats
    .map((beat, i) => {
      const t = itemTime(beat);
      const next = i + 1 < beats.length ? itemTime(beats[i + 1]) : Infinity;
      const mine = extras.filter((e) => e.t >= t && e.t < next).sort((a, b) => a.t - b.t);
      const note = noteFor(t);

      const cuts = mine
        .map(({ item, kind }) => {
          const label = kind === 'settled' ? 'Settled' : kind === 'watch' ? 'Risk' : 'Owed';
          const sev = item.data?.severity ? ` &middot; ${item.data.severity}` : '';
          const owner = item.data?.owner_participant_id
            ? `<div class="rb-owner"><b>${esc(who(item.data.owner_participant_id))}</b> picked this up</div>`
            : '';
          return `<div class="rb-cut ${kind}">
            <span class="rb-cut-kind">${label}${sev}</span>
            <p>${esc(item.text)} ${chips(item.evidence, 3)}</p>
            ${owner}
          </div>`;
        })
        .join('');

      return `<div class="rb-row">
        <div class="rb-time">${clock(t)}</div>
        <div class="rb-rail"><span class="rb-dot"></span></div>
        <div class="rb-body">
          <h3 class="rb-beat">${esc(beat.text)}</h3>
          ${note ? `<p class="rb-note">${esc(note.text)}</p>` : ''}
          ${cuts}
        </div>
      </div>`;
    })
    .join('');

  document.getElementById('ribbon').innerHTML = `
    <div class="rb-head">
      <div class="eyebrow">Aug 16, 2026 &middot; 38 min &middot; 4 people</div>
      <h1 class="rb-title">${esc(S.title)}</h1>
      <div class="rb-meta">
        <span><b>${Object.values(P).map((p) => p.display_name).join(', ')}</b></span>
        <span>${S.cards.decisions.length} settled &middot; ${S.cards.action_items.length} owed &middot; ${
          DATA.state.questions.filter((q) => q.status === 'open').length
        } still open</span>
      </div>

      <div class="minimap">
        <div class="mm-track">${segBars}${markers}<span class="mm-playhead" id="mmHead" style="left:0%"></span></div>
        <div class="mm-axis">${ticks}</div>
        <div class="mm-legend">
          <span><i style="background:var(--leaf)"></i> decision</span>
          <span><i style="background:var(--clay)"></i> risk</span>
          <span><i style="background:var(--ink)"></i> commitment</span>
          <span style="color:var(--faint)">bar height = length of turn, colour = speaker</span>
        </div>
      </div>
    </div>
    <div class="rb-flow">${rows}</div>`;
}

/* ============================================================================
   VIEW 2 — BRIEF
   An editorial page. One column, one measure, hairlines instead of cards,
   timestamps as marginal references. This is the one you print or paste
   into an email. Everything is prose the moment it can be.
   ============================================================================ */

function renderBrief() {
  const S = DATA.state;
  const [lede, ...rest] = S.rolling_summary.split(/\n|(?<=\.)\s+(?=The only|In the second)/);

  const decisions = S.cards.decisions
    .map((d) => {
      const t = itemTime(d);
      return `<li>
        <p class="br-statement">${esc(d.text)}</p>
        <p class="br-sub">Settled at ${chips(d.evidence, 3)}${
          d.status === 'confirmed' ? ' &middot; confirmed by the host' : ''
        }</p>
      </li>`;
    })
    .join('');

  const byOwner = {};
  S.cards.action_items.forEach((a) => {
    const k = a.data?.owner_participant_id || '_none';
    (byOwner[k] = byOwner[k] || []).push(a);
  });
  const owed = Object.entries(byOwner)
    .map(([pid, items]) =>
      items
        .map(
          (a, i) => `<li>
            <span class="br-who">${i === 0 ? esc(pid === '_none' ? 'Unassigned' : who(pid)) : ''}</span>
            <span class="br-what">${esc(a.text)} ${chips(a.evidence, 2)}</span>
          </li>`
        )
        .join('')
    )
    .join('');

  const risks = S.cards.risks
    .sort((a, b) => ({ high: 0, medium: 1, low: 2 }[a.data?.severity] ?? 3) - ({ high: 0, medium: 1, low: 2 }[b.data?.severity] ?? 3))
    .map(
      (r) => `<li>
        <p class="br-q">${esc(r.text)}</p>
        <p class="br-a">${esc(r.data?.severity || 'unrated')} &middot; ${chips(r.evidence, 3)}</p>
      </li>`
    )
    .join('');

  const open = S.questions
    .filter((q) => q.status === 'open')
    .map(
      (q) => `<li>
        <p class="br-q">${esc(q.text)}</p>
        <p class="br-a">${
          q.suggested_answer
            ? `${esc(q.suggested_answer)} <em>(${Math.round(q.suggested_confidence * 100)}% confidence)</em>`
            : 'Nothing in the transcript answers this.'
        } ${chips(q.evidence, 2)}</p>
      </li>`
    )
    .join('');

  const resolved = S.questions
    .filter((q) => q.status === 'resolved')
    .map(
      (q) => `<li style="border-left-color:var(--leaf)">
        <p class="br-q">${esc(q.text)}</p>
        <p class="br-a">${esc(q.answer)} <em>(answered ${
          q.answer_source === 'audio' ? 'in the room' : 'by a participant'
        })</em> ${chips(q.evidence, 2)}</p>
      </li>`
    )
    .join('');

  document.getElementById('brief').innerHTML = `
    <div class="eyebrow br-kicker">Meeting brief &middot; ${esc(S.topic.current)}</div>
    <h1 class="br-title">${esc(S.title)}</h1>
    <div class="br-byline">
      <b>August 16, 2026</b> &middot; 09:30&ndash;10:08 &middot; 38 minutes &middot;
      ${Object.values(P).map((p) => esc(p.display_name)).join(', ')}
    </div>

    <p class="br-lede">${esc(lede)}</p>
    ${rest.map((p) => `<p>${esc(p)}</p>`).join('')}

    <hr class="br-rule" />
    <h2 class="br-h">What was decided</h2>
    <ol class="br-list">${decisions}</ol>

    <hr class="br-rule" />
    <h2 class="br-h">Who owes what</h2>
    <ul class="br-owed">${owed}</ul>

    <hr class="br-rule" />
    <h2 class="br-h">What to watch</h2>
    <ul class="br-open">${risks}</ul>

    <hr class="br-rule" />
    <h2 class="br-h">Still open</h2>
    <ul class="br-open">${open}</ul>
    ${resolved ? `<hr class="br-rule thin" /><h2 class="br-h">Answered in the room</h2><ul class="br-open">${resolved}</ul>` : ''}

    ${
      S.cards.user_notes.length
        ? `<hr class="br-rule" /><h2 class="br-h">Your own note</h2>
           <p class="br-q" style="border-left:2px solid var(--line);padding-left:20px">${esc(
             S.cards.user_notes[0].text
           )}</p>`
        : ''
    }

    <p class="br-foot">
      Transcribed locally with ${esc(DATA.meeting.asr_model)} and synthesised in a single consolidation pass.
      Every timestamp is a link back into the recording.<br />
      ${S.cards.key_points.length} key points, ${S.cards.decisions.length} decisions,
      ${S.cards.action_items.length} commitments and ${S.cards.risks.length} risks were drawn from
      ${DATA.segments.length} transcript segments.
    </p>`;
}

/* ============================================================================
   VIEW 3 — LEDGER
   The trust view. Every synthesised line sits beside the verbatim words that
   produced it. This is the one thing a cloud notetaker cannot show you,
   because the evidence[] -> segment link is the core of this data model.
   ============================================================================ */

function renderLedger() {
  const S = DATA.state;

  const entry = (item, tags) => {
    const sources = (item.evidence || [])
      .filter((id) => SEG[id])
      .map((id) => {
        const s = SEG[id];
        return `<div class="lg-quote" data-quote="${id}">
          <div class="lg-attr">
            <span style="color:${SPEAKER_COLOR[s.speaker_participant_id]}">${esc(
          who(s.speaker_participant_id)
        )}</span>
            <button class="t" data-seg="${id}" onclick="goto('${id}')">${clock(s.start_s)}</button>
          </div>
          <blockquote>${esc(s.text)}</blockquote>
        </div>`;
      })
      .join('');

    return `<div class="lg-entry">
      <div class="lg-claim">
        <p>${esc(item.text)}</p>
        <div class="lg-tags">${tags || ''}</div>
      </div>
      <div class="lg-source">${
        sources || '<div class="lg-unsourced">No transcript segment backs this line.</div>'
      }</div>
    </div>`;
  };

  const group = (title, blurb, items, tagger) => {
    if (!items.length) return '';
    return `<section class="lg-group">
      <div class="lg-group-head">
        <h2 class="serif" style="font-size:24px;margin:0">${title}</h2>
        <span class="lg-count">${items.length} claim${items.length === 1 ? '' : 's'} &middot; ${items.reduce(
      (n, i) => n + i.evidence.length,
      0
    )} source${items.reduce((n, i) => n + i.evidence.length, 0) === 1 ? '' : 's'}</span>
      </div>
      ${blurb ? `<p style="font-size:13.5px;color:var(--soft);margin:10px 0 0">${blurb}</p>` : ''}
      ${items.map((i) => entry(i, tagger ? tagger(i) : '')).join('')}
    </section>`;
  };

  const statusTag = (i) =>
    i.status === 'confirmed'
      ? '<span class="lg-tag owner">confirmed by host</span>'
      : i.status === 'edited'
      ? '<span class="lg-tag">edited by hand</span>'
      : '<span class="lg-tag">as suggested</span>';

  document.getElementById('ledger').innerHTML = `
    <div class="lg-head">
      <div class="eyebrow">Evidence ledger</div>
      <h1>Every line, and the words it came from.</h1>
      <p>
        The left column is what the model wrote. The right column is the raw transcript it cited &mdash;
        unedited, attributed, and playable. Nothing appears on the left without something on the right.
      </p>
    </div>

    ${group('Decisions', '', S.cards.decisions, statusTag)}
    ${group(
      'Commitments',
      '',
      S.cards.action_items,
      (i) =>
        (i.data?.owner_participant_id
          ? `<span class="lg-tag owner">${esc(who(i.data.owner_participant_id))}</span>`
          : '<span class="lg-tag">unassigned</span>') + statusTag(i)
    )}
    ${group(
      'Risks',
      '',
      S.cards.risks,
      (i) =>
        `<span class="lg-tag ${i.data?.severity === 'high' ? 'high' : ''}">${esc(
          i.data?.severity || 'unrated'
        )}</span>` + statusTag(i)
    )}
    ${group('Key points', '', S.cards.key_points, statusTag)}`;
}

/* ============================================================================
   VIEW 4 — SIGNAL
   One screen. For the person who missed the meeting and has forty seconds.
   A headline, three columns, and three clips worth actually listening to.
   ============================================================================ */

function renderSignal() {
  const S = DATA.state;
  const lead = S.cards.decisions[0];

  const col = (title, items, cls, meta) => `
    <div class="sg-col ${cls || ''}">
      <div class="sg-col-head"><h3>${title}</h3><span class="sg-n">${items.length}</span></div>
      <ul>${items
        .map(
          (i) => `<li>${esc(i.text)}<span class="sg-meta">${meta ? meta(i) : ''} ${chips(i.evidence, 1)}</span></li>`
        )
        .join('')}</ul>
    </div>`;

  /* The three moments worth hearing: the decision, the blocker, the pushback. */
  const picks = ['sg_08', 'sg_14', 'sg_19'].map((id) => {
    const s = SEG[id];
    return `<button class="sg-pick" onclick="goto('${id}')">
      <span class="sg-pick-t">${clock(s.start_s)} &middot; ${esc(who(s.speaker_participant_id))}</span>
      <span class="sg-pick-q">&ldquo;${esc(s.text)}&rdquo;</span>
    </button>`;
  });

  document.getElementById('signal').innerHTML = `
    <div class="sg-top">
      <div class="eyebrow">If you missed it</div>
      <div class="sg-when">Aug 16 &middot; 38 min &middot; ${Object.values(P)
        .map((p) => esc(p.display_name))
        .join(', ')}</div>
    </div>

    <h1 class="sg-headline">Postgres 16 goes live <span class="hl">September 15</span>, and search is going hybrid.</h1>
    <p class="sg-standfirst">
      Benchmarks cleared, one blocker outstanding on staging bandwidth, and both the embedding
      nodes and the Redis tier were pushed to Q4 to keep a single migration in flight.
    </p>

    <div class="sg-cols">
      ${col('Decided', S.cards.decisions, '', () => '')}
      ${col('Owed', S.cards.action_items, '', (i) =>
        i.data?.owner_participant_id ? `<b>${esc(who(i.data.owner_participant_id))}</b> &middot;` : 'unassigned &middot;'
      )}
      ${col(
        'Watch',
        [
          ...S.cards.risks,
          ...S.questions.filter((q) => q.status === 'open').map((q) => ({ text: q.text, evidence: q.evidence, data: {}, _q: true })),
        ],
        'watch',
        (i) => (i._q ? 'open question &middot;' : `${esc(i.data?.severity || 'unrated')} risk &middot;`)
      )}
    </div>

    <div class="sg-listen">
      <h3>Three minutes worth hearing</h3>
      <div class="sg-picks">${picks.join('')}</div>
    </div>`;
}

/* ============================================================================
   VIEW 5 — LANES
   The people cut. Talk share and turn density per participant, beside what
   each of them actually walked away holding. Makes silence visible, which is
   usually the most useful thing in a meeting report.
   ============================================================================ */

function renderLanes() {
  const S = DATA.state;

  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span>${clock(DURATION * f)}</span>`).join('');

  const order = Object.values(P).sort(
    (a, b) => (talk[b.id] || 0) - (talk[a.id] || 0)
  );

  const lanes = order
    .map((p) => {
      const share = Math.round(((talk[p.id] || 0) / talkTotal) * 100);
      const colour = SPEAKER_COLOR[p.id];

      const strip = DATA.segments
        .filter((s) => s.speaker_participant_id === p.id)
        .map((s) => {
          const left = (s.start_s / DURATION) * 100;
          const w = Math.max(0.4, ((s.end_s - s.start_s) / DURATION) * 100);
          return `<i style="left:${left}%;width:${w}%;background:${colour}" title="${clock(s.start_s)}"></i>`;
        })
        .join('');

      const owed = S.cards.action_items.filter((a) => a.data?.owner_participant_id === p.id);
      /* Attribute a decision to whoever was speaking in its FIRST cited segment,
         so it lands in exactly one lane rather than everyone who was quoted. */
      const settled = S.cards.decisions.filter(
        (d) => SEG[(d.evidence || [])[0]]?.speaker_participant_id === p.id
      );

      const rows = [
        ...settled.map(
          (d) => `<li><span class="ln-kind settled">Settled</span><span>${esc(d.text)} ${chips(d.evidence, 2)}</span></li>`
        ),
        ...owed.map(
          (a) => `<li><span class="ln-kind owed">Owes</span><span>${esc(a.text)} ${chips(a.evidence, 2)}</span></li>`
        ),
      ];

      return `<div class="lane">
        <div class="ln-person">
          <div class="ln-avatar" style="background:${colour}">${esc(p.display_name[0])}</div>
          <div>
            <div class="ln-name">${esc(p.display_name)}${p.kind === 'me' ? ' <span class="ln-role">(you)</span>' : ''}</div>
            <div class="ln-role">${
              p.is_provisional
                ? 'name inferred, unconfirmed'
                : p.name_source === 'agent_inferred'
                ? 'name inferred'
                : 'host'
            }</div>
            <div class="ln-share">${share}% of the talking &middot; ${clock(talk[p.id] || 0)}</div>
            <div class="ln-bar"><i style="width:${share}%;background:${colour}"></i></div>
          </div>
        </div>
        <div class="ln-right">
          <div class="ln-strip">${strip}</div>
          ${
            rows.length
              ? `<ul class="ln-commits">${rows.join('')}</ul>`
              : '<p class="ln-quiet">Spoke, but left holding nothing. Worth checking whether that was intentional.</p>'
          }
        </div>
      </div>`;
    })
    .join('');

  document.getElementById('lanes').innerHTML = `
    <div class="ln-head">
      <div class="eyebrow">The room</div>
      <h1>Who talked, and who left holding something.</h1>
      <p>
        Turn density comes straight from the diarised segments. Commitments are attributed from
        <span class="mono" style="font-size:12.5px">data.owner_participant_id</span>; decisions from whoever was
        speaking in the cited segment.
      </p>
    </div>
    <div class="ln-axis"><span></span><div class="ln-axis-ticks">${ticks}</div></div>
    ${lanes}`;
}

/* ============================================================================
   Scrubber — simulated playback so the timestamp interaction is real
   ============================================================================ */

let pos = 0;
let timer = null;

function paint() {
  const pct = (pos / DURATION) * 100;
  document.getElementById('scFill').style.width = pct + '%';
  document.getElementById('scKnob').style.left = pct + '%';
  document.getElementById('scTime').textContent = `${clock(pos)} / ${clock(DURATION)}`;
  const head = document.getElementById('mmHead');
  if (head) head.style.left = pct + '%';

  const current = DATA.segments.filter((s) => s.start_s <= pos).pop();
  const line = document.getElementById('scLine');
  if (current && pos <= current.end_s + 8) {
    line.innerHTML = `<b>${esc(who(current.speaker_participant_id))}</b> &nbsp;${esc(current.text)}`;
  } else if (current) {
    line.innerHTML = `<span class="sc-idle">${clock(pos)} &mdash; between turns</span>`;
  }

  document.querySelectorAll('.t').forEach((el) => {
    const s = SEG[el.dataset.seg];
    el.classList.toggle('playing', !!s && pos >= s.start_s && pos <= s.end_s);
  });
  document.querySelectorAll('.lg-quote').forEach((el) => {
    const s = SEG[el.dataset.quote];
    el.classList.toggle('active', !!s && pos >= s.start_s && pos <= s.end_s);
  });
}

function seek(seconds) {
  pos = Math.max(0, Math.min(DURATION, seconds));
  paint();
}

function goto(segId) {
  const s = SEG[segId];
  if (!s) return;
  seek(s.start_s);
  if (!timer) togglePlay();
}

function seekFromTrack(e) {
  const r = e.currentTarget.getBoundingClientRect();
  seek(((e.clientX - r.left) / r.width) * DURATION);
}

function togglePlay() {
  const btn = document.getElementById('playBtn');
  if (timer) {
    clearInterval(timer);
    timer = null;
    btn.innerHTML = '&#9654;';
    return;
  }
  btn.innerHTML = '&#10073;&#10073;';
  timer = setInterval(() => {
    pos += 0.5;
    if (pos >= DURATION) {
      pos = DURATION;
      togglePlay();
    }
    paint();
  }, 500);
}

/* ============================================================================
   Tabs
   ============================================================================ */

const VIEWS = [
  { id: 'ribbon', label: 'Ribbon', note: 'The meeting against its own clock. Walk it in order; the minimap shows where the conversation actually happened. <em>Best for: catching up properly.</em>' },
  { id: 'brief',  label: 'Brief',  note: 'One editorial page, one column, no boxes. Prints and pastes cleanly. <em>Best for: sending to someone who was not there.</em>' },
  { id: 'ledger', label: 'Ledger', note: 'Every synthesised line beside the verbatim words that produced it. <em>Best for: when someone disputes the notes.</em>' },
  { id: 'signal', label: 'Signal', note: 'One screen, no scrolling, plus the three clips worth hearing. <em>Best for: forty seconds before the next call.</em>' },
  { id: 'lanes',  label: 'Lanes',  note: 'Talk share and turn density per person, beside what each walked away holding. <em>Best for: spotting who was silent.</em>' },
];

function switchTo(id) {
  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.view === id));
  document.getElementById('tabNote').innerHTML = VIEWS.find((v) => v.id === id).note;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  paint();
}

document.getElementById('tabs').innerHTML = VIEWS.map(
  (v, i) =>
    `<button class="tab${i === 0 ? ' active' : ''}" data-view="${v.id}" onclick="switchTo('${v.id}')">${v.label}</button>`
).join('');
document.getElementById('tabNote').innerHTML = VIEWS[0].note;

renderRibbon();
renderBrief();
renderLedger();
renderSignal();
renderLanes();
paint();
</script>
