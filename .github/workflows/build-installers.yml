name: Build native installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing draft release tag to upload to (optional, e.g. v2.5.0)"
        required: false
        type: string

permissions:
  contents: read

# Never let two runs race while replacing assets in the same draft release.
concurrency:
  group: native-installers-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # github.sha locks an untagged dispatch to the commit selected when
          # the run started, even if the branch advances during the build.
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = python -c "import _version; print(_version.__version__)"
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match _version.py ($version)"
          }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\python -m pip install --upgrade pip
          .\venv\Scripts\python -m pip install `
            -r requirements.txt -r requirements-build.txt `
            -c requirements-release-constraints.txt
          .\venv\Scripts\python -m pip check
          choco install innosetup --version=6.4.0 --allow-downgrade --yes --no-progress
      - name: Check ASGI test stack compatibility
        shell: pwsh
        run: .\venv\Scripts\python scripts\check_testclient_compat.py --timeout 15
      - name: Build and verify
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-windows
          path: |
            installer/Output/OpenWhisper-Setup-*.exe
            installer/Output/OpenWhisper-*-win64.tar.xz
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(python -c 'import _version; print(_version.__version__)')"
          test "v$version" = "$RELEASE_TAG"
      - name: Install system and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential desktop-file-utils dpkg-dev file \
            libarchive-tools lintian patchelf xauth xvfb zstd \
            libdrm2 libegl1 libgl1 libportaudio2 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install \
            -r requirements.txt -r requirements-build.txt \
            -c requirements-release-constraints.txt
          ./venv/bin/python -m pip check
      - name: Check ASGI test stack compatibility
        run: ./venv/bin/python scripts/check_testclient_compat.py --timeout 15
      - name: Run Linux test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ./venv/bin/python -m pytest
      - name: Build and verify
        run: ./scripts/build_installer.sh --clean
      - name: Smoke-test package lifecycle in clean Ubuntu
        run: |
          artifacts=(installer/Output/OpenWhisper-*-linux-amd64.deb)
          version="$(./venv/bin/python -c 'import _version; print(_version.__version__)')"
          test "${#artifacts[@]}" -eq 1
          artifact="$(realpath "${artifacts[0]}")"
          docker run --rm \
            -e EXPECTED_VERSION="$version" \
            -v "$artifact:/tmp/openwhisper.deb:ro" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends file /tmp/openwhisper.deb
              test "$(openwhisper --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(ow --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(dpkg-query -W -f=\${Version} openwhisper)" = "$EXPECTED_VERSION"
              test -f /usr/share/applications/openwhisper.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/openwhisper.png

              failures="$(mktemp)"
              while IFS= read -r -d "" candidate; do
                file -b "$candidate" | grep -q ELF || continue
                if ! output="$(LD_LIBRARY_PATH=/usr/lib/openwhisper/_internal ldd "$candidate" 2>&1)"; then
                  printf "%s\n%s\n" "$candidate" "$output" >>"$failures"
                elif grep -q "not found" <<<"$output"; then
                  printf "%s\n%s\n" "$candidate" "$output" >>"$failures"
                fi
              done < <(find /usr/lib/openwhisper -type f -print0)
              test ! -s "$failures" || { cat "$failures" >&2; exit 1; }

              apt-get install -y --no-install-recommends xauth xvfb
              xvfb-run -a openwhisper --self-test
              apt-get remove -y openwhisper
              test ! -e /usr/lib/openwhisper
              test ! -e /usr/bin/openwhisper
              test ! -e /usr/bin/ow
            '
      - name: Smoke-test advertised Debian 12 support
        run: |
          artifacts=(installer/Output/OpenWhisper-*-linux-amd64.deb)
          version="$(./venv/bin/python -c 'import _version; print(_version.__version__)')"
          test "${#artifacts[@]}" -eq 1
          artifact="$(realpath "${artifacts[0]}")"
          docker run --rm \
            -e EXPECTED_VERSION="$version" \
            -v "$artifact:/tmp/openwhisper.deb:ro" \
            debian:12 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                file xauth xvfb /tmp/openwhisper.deb
              test "$(openwhisper --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(ow --version)" = "OpenWhisper $EXPECTED_VERSION"
              xvfb-run -a openwhisper --self-test
              apt-get remove -y openwhisper
              test ! -e /usr/lib/openwhisper
              test ! -e /usr/bin/openwhisper
              test ! -e /usr/bin/ow
            '
      - name: Smoke-test advertised Arch Linux support
        run: |
          artifacts=(installer/Output/OpenWhisper-*-linux-x86_64.pkg.tar.zst)
          version="$(./venv/bin/python -c 'import _version; print(_version.__version__)')"
          test "${#artifacts[@]}" -eq 1
          artifact="$(realpath "${artifacts[0]}")"
          docker run --rm \
            -e EXPECTED_VERSION="$version" \
            -v "$artifact:/tmp/openwhisper.pkg.tar.zst:ro" \
            archlinux:latest bash -euo pipefail -c '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed file namcap xorg-server-xvfb
              # Official image NoExtracts usr/share/doc; drop that so the guide installs.
              rm -f /etc/pacman.conf.d/noextract.conf
              pacman -U --noconfirm /tmp/openwhisper.pkg.tar.zst
              set -x
              test "$(openwhisper --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(ow --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(pacman -Q openwhisper)" = "openwhisper $EXPECTED_VERSION-1"
              package_info="$(pacman -Qi openwhisper)"
              grep -Fq "MIT" <<<"$package_info"
              grep -Fq "GPL-3.0-only" <<<"$package_info"
              grep -Fq "LGPL-3.0-only" <<<"$package_info"
              test -f /usr/share/applications/openwhisper.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/openwhisper.png
              test -f /usr/share/doc/openwhisper/linux-system-audio.md
              test -f /usr/share/licenses/openwhisper/LICENSE
              test -f /usr/share/licenses/openwhisper/PyQt6-GPL-3.0.txt
              test -f /usr/share/licenses/openwhisper/Qt-LGPL-3.0.txt
              pacman -Qkk openwhisper
              namcap /tmp/openwhisper.pkg.tar.zst || \
                echo "namcap reported findings (advisory; not a gate)"
              set +x

              failures="$(mktemp)"
              while IFS= read -r -d "" candidate; do
                file -b "$candidate" | grep -q ELF || continue
                if ! output="$(LD_LIBRARY_PATH=/usr/lib/openwhisper/_internal ldd "$candidate" 2>&1)"; then
                  printf "%s\n%s\n" "$candidate" "$output" >>"$failures"
                elif grep -q "not found" <<<"$output"; then
                  printf "%s\n%s\n" "$candidate" "$output" >>"$failures"
                fi
              done < <(find /usr/lib/openwhisper -type f -print0)
              test ! -s "$failures" || { cat "$failures" >&2; exit 1; }

              Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
              xvfb_pid=$!
              export DISPLAY=:99
              sleep 2
              kill -0 "$xvfb_pid" || { cat /tmp/xvfb.log >&2; exit 1; }
              openwhisper --self-test
              kill "$xvfb_pid"

              pacman -R --noconfirm openwhisper
              test ! -e /usr/lib/openwhisper
              test ! -e /usr/bin/openwhisper
              test ! -e /usr/bin/ow
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-linux
          path: |
            installer/Output/OpenWhisper-*-linux-amd64.deb
            installer/Output/OpenWhisper-*-linux-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Apple Silicon host
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
      - name: Validate tag version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(python -c 'import _version; print(_version.__version__)')"
          test "v$version" = "$RELEASE_TAG"
      - name: Install Python build dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install \
            -r requirements.txt -r requirements-build.txt \
            -c requirements-release-constraints.txt
          ./venv/bin/python -m pip check
      - name: Check ASGI test stack compatibility
        run: ./venv/bin/python scripts/check_testclient_compat.py --timeout 15
      - name: Run test suite
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./venv/bin/python -m pytest -vv --maxfail=1
      - name: Build and verify DMG
        # Ad-hoc signed and unnotarized by design. No Apple Developer secrets.
        run: ./scripts/build_installer_macos.sh --clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-macos
          path: |
            installer/Output/OpenWhisper-*-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Combined release candidate
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openwhisper-*
          merge-multiple: true
          path: release
      - name: Inventory, build metadata, and checksums
        env:
          BUILD_REF: ${{ inputs.release_tag || github.ref }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Five application artifacts: Win setup, Win archive, deb, Arch, macOS DMG.
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(find release -maxdepth 1 -name 'OpenWhisper-*-macos-arm64.dmg' | wc -l)" -eq 1
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          export BUILD_VERSION="$(python3 -c 'import _version; print(_version.__version__)')"
          export BUILT_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schema_version": 1,
              "version": os.environ["BUILD_VERSION"],
              "commit_sha": os.environ["BUILD_COMMIT"],
              "source_ref": os.environ["BUILD_REF"],
              "built_at_utc": os.environ["BUILT_AT_UTC"],
              "repository": os.environ["BUILD_REPOSITORY"],
              "workflow_run_id": int(os.environ["BUILD_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["BUILD_RUN_ATTEMPT"]),
              "workflow_run_url": os.environ["BUILD_RUN_URL"],
          }
          Path("release/BUILD-METADATA.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          (cd release && sha256sum -- OpenWhisper-* BUILD-METADATA.json | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14

  upload-draft:
    name: Upload to existing draft release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openwhisper-release-candidate
          path: release
      - name: Verify draft and upload all native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(python3 -c 'import _version; print(_version.__version__)')"
          test "$RELEASE_TAG" = "v$version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh release upload "$RELEASE_TAG" \
            release/OpenWhisper-Setup-"$version".exe \
            release/OpenWhisper-"$version"-win64.tar.xz \
            release/OpenWhisper-"$version"-linux-amd64.deb \
            release/OpenWhisper-"$version"-linux-x86_64.pkg.tar.zst \
            release/OpenWhisper-"$version"-macos-arm64.dmg \
            release/BUILD-METADATA.json \
            release/SHA256SUMS.txt \
            --clobber

          for file in release/*; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | cut -d" " -f1)"
            uploaded="$(gh api \
              "$release_api" \
              --jq ".assets[] | select(.name == \"$name\") | .digest")"
            test "$uploaded" = "$expected"
          done
