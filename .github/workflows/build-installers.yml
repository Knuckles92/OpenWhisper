name: Build native installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Source tag to build (optional, e.g. v2.5.0); verify the candidate before draft upload"
        required: false
        type: string
      setup_only_windows:
        description: "Emergency release: omit the Windows native-update archive"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Serialize candidate builds and verified uploads for the same tag.
concurrency:
  group: native-installers-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve candidate source once
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  qualification:
    name: Full source qualification
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}

  windows:
    name: Windows installer
    needs: [source, qualification]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = python -c "import _version; print(_version.__version__)"
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match _version.py ($version)"
          }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\python -m pip install --upgrade pip
          .\venv\Scripts\python -m pip install `
            -r requirements.txt -r requirements-build.txt `
            -c requirements-release-constraints.txt
          .\venv\Scripts\python -m pip check
          choco install innosetup --version=6.4.0 --allow-downgrade --yes --no-progress
      - name: Check ASGI test stack compatibility
        shell: pwsh
        run: .\venv\Scripts\python scripts\check_testclient_compat.py --timeout 15
      - name: Run Windows updater regressions
        shell: pwsh
        run: |
          . .\venv\Scripts\Activate.ps1
          python -m pytest tests/test_app_update.py tests/test_app_update_rate_limit.py tests/test_app_update_apply.py tests/test_app_update_dialog.py tests/test_app_update_handoff.py tests/test_updater_helper.py tests/test_update_startup_gate.py tests/test_update_resilience.py tests/test_application_controller.py tests/test_bootstrap.py -q
      - name: Configure Windows code signing
        # Optional, one method at a time. With either set the executables, the
        # uninstaller and the setup exe are Authenticode signed, timestamped
        # and verified; with neither they stay unsigned and the run says so.
        # docs/windows-signing.md lists what each secret holds. The secrets
        # are scoped to the steps that use them, not to the whole job, so
        # dependency installs and tests never see them.
        shell: pwsh
        env:
          # Method 1: an OV/EV code-signing certificate exported as a PFX.
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Method 2: Azure Trusted Signing (an app registration with the
          # "Trusted Signing Certificate Profile Signer" role).
          AZURE_TRUSTED_SIGNING_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          TRUSTED_SIGNING_CLIENT_VERSION: "1.0.53"
        run: |
          # An unset secret arrives as an empty or missing variable.
          $pfx = -not [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PFX)
          $azure = -not [string]::IsNullOrEmpty($env:AZURE_TRUSTED_SIGNING_CLIENT_ID)
          if ($pfx -and $azure) {
            throw 'Set either the WINDOWS_CERTIFICATE_* or the AZURE_TRUSTED_SIGNING_* secrets, not both.'
          }
          if ($pfx) {
            $file = Join-Path $env:RUNNER_TEMP 'openwhisper-signing.pfx'
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            try {
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $password
            } finally {
              Remove-Item -LiteralPath $file -Force
            }
            $thumbprint = @($cert | Where-Object HasPrivateKey)[0].Thumbprint
            if (-not $thumbprint) { throw 'The PFX has no certificate with a private key.' }
            "OPENWHISPER_SIGN_CERT_SHA1=$thumbprint" >> $env:GITHUB_ENV
            Write-Host "::notice title=Windows signing::Signing with certificate $thumbprint."
          } elseif ($azure) {
            foreach ($name in 'TENANT_ID', 'CLIENT_SECRET', 'ENDPOINT', 'ACCOUNT', 'PROFILE') {
              if (-not [Environment]::GetEnvironmentVariable("AZURE_TRUSTED_SIGNING_$name")) {
                throw "AZURE_TRUSTED_SIGNING_$name is missing."
              }
            }
            $dir = Join-Path $env:RUNNER_TEMP 'trusted-signing'
            nuget install Microsoft.Trusted.Signing.Client -Version $env:TRUSTED_SIGNING_CLIENT_VERSION -OutputDirectory $dir -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the Trusted Signing client.' }
            $dlib = Get-ChildItem -Path $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found.' }
            $metadata = Join-Path $env:RUNNER_TEMP 'trusted-signing-metadata.json'
            @{
              Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT
              CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_PROFILE
            } | ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8
            "OPENWHISPER_SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
            "OPENWHISPER_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
            Write-Host "::notice title=Windows signing::Signing with Azure Trusted Signing."
          } else {
            Write-Host "::notice title=Windows signing::No Windows signing secrets are set; the executables and installer will be unsigned. See docs/windows-signing.md."
          }
      - name: Build and verify
        # Signs, timestamps and verifies when the step above configured a
        # method; otherwise builds unsigned and verifies nothing is signed.
        # Either way it writes build/windows-signing.json.
        shell: pwsh
        env:
          # Read by the Trusted Signing dlib (Azure EnvironmentCredential).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
        run: .\scripts\build_installer.ps1 -Clean
      - name: Remove signing certificate
        if: always() && env.OPENWHISPER_SIGN_CERT_SHA1 != ''
        shell: pwsh
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:OPENWHISPER_SIGN_CERT_SHA1" -DeleteKey -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signing
          path: build/windows-signing.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-health-windows
          path: build/release-health.json
          if-no-files-found: ignore
      - name: Verify frozen setup helper protocol
        shell: pwsh
        env:
          OPENWHISPER_TEST_FROZEN_HELPER: dist/OpenWhisper/OpenWhisperUpdater.exe
        run: |
          . .\venv\Scripts\Activate.ps1
          python -m pytest tests/test_frozen_updater.py -q
      - name: Upgrade previous stable installation and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'previous-release'
          New-Item -ItemType Directory -Force -Path $previous | Out-Null
          $release = gh api "repos/$env:RELEASE_REPOSITORY/releases/latest" | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { $_.name -like 'OpenWhisper-Setup-*.exe' })
          if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw 'Previous stable release needs one verified setup asset.'
          }
          gh release download $release.tag_name --repo $env:RELEASE_REPOSITORY --pattern $asset[0].name --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous setup download failed.' }
          $previousSetup = Join-Path $previous $asset[0].name
          if ((Get-FileHash -LiteralPath $previousSetup -Algorithm SHA256).Hash.ToLower() -ne $asset[0].digest.Substring(7)) {
            throw 'Previous setup digest mismatch.'
          }
          . .\venv\Scripts\Activate.ps1
          $version = python -c "import _version; print(_version.__version__)"
          .\scripts\smoke_windows_setup.ps1 -PreviousSetup $previousSetup -NewSetup "installer/Output/OpenWhisper-Setup-$version.exe" -Version $version
      - name: Preserve Windows lifecycle logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-setup-logs
          path: ${{ runner.temp }}/openwhisper-setup-logs
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-windows
          path: |
            installer/Output/OpenWhisper-Setup-*.exe
            installer/Output/OpenWhisper-*-win64.tar.xz
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    needs: [source, qualification]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(python -c 'import _version; print(_version.__version__)')"
          test "v$version" = "$RELEASE_TAG"
      - name: Install system and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential desktop-file-utils dpkg-dev file \
            libarchive-tools lintian patchelf xauth xvfb zstd \
            libdrm2 libegl1 libgl1 libportaudio2 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install \
            -r requirements.txt -r requirements-build.txt \
            -c requirements-release-constraints.txt
          ./venv/bin/python -m pip check
      # The full suite already ran on this commit, this OS and these pins in
      # the qualification job, so the builder goes straight to packaging.
      - name: Build and verify
        run: ./scripts/build_installer.sh --clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-health-linux
          path: build/release-health.json
          if-no-files-found: ignore
      - name: Smoke-test package lifecycle in clean Ubuntu
        run: |
          artifacts=(installer/Output/OpenWhisper-*-linux-amd64.deb)
          version="$(./venv/bin/python -c 'import _version; print(_version.__version__)')"
          test "${#artifacts[@]}" -eq 1
          artifact="$(realpath "${artifacts[0]}")"
          docker run --rm \
            -e EXPECTED_VERSION="$version" \
            -v "$artifact:/tmp/openwhisper.deb:ro" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends file /tmp/openwhisper.deb
              test "$(openwhisper --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(ow --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(dpkg-query -W -f=\${Version} openwhisper)" = "$EXPECTED_VERSION"
              test -f /usr/share/applications/openwhisper.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/openwhisper.png

              failures="$(mktemp)"
              while IFS= read -r -d "" candidate; do
                file -b "$candidate" | grep -q ELF || continue
                if ! output="$(LD_LIBRARY_PATH=/usr/lib/openwhisper/_internal ldd "$candidate" 2>&1)"; then
                  printf "%s\n%s\n" "$candidate" "$output" >>"$failures"
                elif grep -q "not found" <<<"$output"; then
                  printf "%s\n%s\n" "$candidate" "$output" >>"$failures"
                fi
              done < <(find /usr/lib/openwhisper -type f -print0)
              test ! -s "$failures" || { cat "$failures" >&2; exit 1; }

              apt-get install -y --no-install-recommends xauth xvfb
              xvfb-run -a openwhisper --self-test
              apt-get remove -y openwhisper
              test ! -e /usr/lib/openwhisper
              test ! -e /usr/bin/openwhisper
              test ! -e /usr/bin/ow
            '
      - name: Smoke-test advertised Debian 12 support
        run: |
          artifacts=(installer/Output/OpenWhisper-*-linux-amd64.deb)
          version="$(./venv/bin/python -c 'import _version; print(_version.__version__)')"
          test "${#artifacts[@]}" -eq 1
          artifact="$(realpath "${artifacts[0]}")"
          docker run --rm \
            -e EXPECTED_VERSION="$version" \
            -v "$artifact:/tmp/openwhisper.deb:ro" \
            debian:12 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                file xauth xvfb /tmp/openwhisper.deb
              test "$(openwhisper --version)" = "OpenWhisper $EXPECTED_VERSION"
              test "$(ow --version)" = "OpenWhisper $EXPECTED_VERSION"
              xvfb-run -a openwhisper --self-test
              apt-get remove -y openwhisper
              test ! -e /usr/lib/openwhisper
              test ! -e /usr/bin/openwhisper
              test ! -e /usr/bin/ow
            '
      - name: Smoke-test advertised Arch Linux support
        run: |
          artifacts=(installer/Output/OpenWhisper-*-linux-x86_64.pkg.tar.zst)
          version="$(./venv/bin/python -c 'import _version; print(_version.__version__)')"
          test "${#artifacts[@]}" -eq 1
          artifact="$(realpath "${artifacts[0]}")"
          docker run --rm \
            -e EXPECTED_VERSION="$version" \
            -v "$artifact:/tmp/openwhisper.pkg.tar.zst:ro" \
            -v "$PWD/scripts/smoke_arch_package.sh:/tmp/smoke_arch_package.sh:ro" \
            archlinux:latest bash /tmp/smoke_arch_package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-linux
          path: |
            installer/Output/OpenWhisper-*-linux-amd64.deb
            installer/Output/OpenWhisper-*-linux-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG (Apple Silicon)
    needs: [source, qualification]
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # Optional. With all five set the DMG is Developer ID signed, notarized
      # and stapled; without them it stays ad-hoc signed and unnotarized.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Apple Silicon host
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
      - name: Configure loopback alias for MCP listener tests
        # macOS needs an explicit alias for the second IPv4 loopback listener.
        run: sudo ifconfig lo0 alias 127.0.0.2 netmask 255.255.255.255 up
      - name: Validate tag version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(python -c 'import _version; print(_version.__version__)')"
          test "v$version" = "$RELEASE_TAG"
      - name: Install Python build dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install \
            -r requirements.txt -r requirements-build.txt \
            -c requirements-release-constraints.txt
          ./venv/bin/python -m pip check
      # The full macOS suite already ran on this commit in the qualification
      # job (ci.yml "macOS tests"), so the builder goes straight to packaging.
      - name: Import Developer ID signing and notary credentials
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_NOTARY_KEY_P8 != ''
        run: |
          keychain="$RUNNER_TEMP/openwhisper-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode >"$key"
          {
            echo "OPENWHISPER_MACOS_CODESIGN_IDENTITY=$identity"
            echo "OPENWHISPER_MACOS_NOTARY_KEY=$key"
            echo "OPENWHISPER_MACOS_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"
            echo "OPENWHISPER_MACOS_NOTARY_ISSUER=$MACOS_NOTARY_ISSUER"
          } >>"$GITHUB_ENV"
      - name: Build and verify DMG
        # Developer ID signed and notarized when the step above imported
        # credentials; ad-hoc signed and unnotarized otherwise.
        run: ./scripts/build_installer_macos.sh --clean
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/openwhisper-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-health-macos
          path: |
            build/release-health.json
            build/installed-release-health.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-macos
          path: |
            installer/Output/OpenWhisper-*-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Combined release candidate
    needs: [source, windows, linux, macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openwhisper-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-signing
          path: signing
      - name: Inventory, build metadata, and checksums
        env:
          BUILD_REF: ${{ inputs.release_tag || github.ref }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SETUP_ONLY_WINDOWS: ${{ inputs.setup_only_windows }}
        run: |
          bridge="$(python3 -c 'from _version import __version__; from services.update_contract import is_setup_bridge_release; print(str(is_setup_bridge_release(__version__)).lower())')"
          if [[ "$bridge" == "true" ]]; then export SETUP_ONLY_WINDOWS=true; fi
          if [[ "$SETUP_ONLY_WINDOWS" == "true" ]]; then
            rm -f release/OpenWhisper-*-win64.tar.xz
            expected_artifacts=4
          else
            expected_artifacts=5
          fi
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "$expected_artifacts"
          test "$(find release -maxdepth 1 -name 'OpenWhisper-Setup-*.exe' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name 'OpenWhisper-*-linux-amd64.deb' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name 'OpenWhisper-*-linux-x86_64.pkg.tar.zst' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name 'OpenWhisper-*-macos-arm64.dmg' | wc -l)" -eq 1
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          export BUILD_VERSION="$(python3 -c 'import _version; print(_version.__version__)')"
          export BUILT_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Bound to the exact setup exe: a report from another build fails.
          export WINDOWS_SIGNING="$(python3 scripts/windows_signing.py metadata \
            --report signing/windows-signing.json --release release)"
          if [[ "$(python3 -c 'import json, os; print(json.loads(os.environ["WINDOWS_SIGNING"])["windows_signed"])')" == "True" ]]; then
            echo "::notice title=Windows signing::The Windows executables and installer are signed."
          else
            echo "::notice title=Windows signing::The Windows executables and installer are unsigned."
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schema_version": 3,
              "source_qualification": "passed",
              "windows_setup_only": os.environ["SETUP_ONLY_WINDOWS"] == "true",
              **json.loads(os.environ["WINDOWS_SIGNING"]),
              "version": os.environ["BUILD_VERSION"],
              "commit_sha": os.environ["BUILD_COMMIT"],
              "source_ref": os.environ["BUILD_REF"],
              "built_at_utc": os.environ["BUILT_AT_UTC"],
              "repository": os.environ["BUILD_REPOSITORY"],
              "workflow_run_id": int(os.environ["BUILD_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["BUILD_RUN_ATTEMPT"]),
              "workflow_run_url": os.environ["BUILD_RUN_URL"],
          }
          Path("release/BUILD-METADATA.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          (cd release && sha256sum -- OpenWhisper-* BUILD-METADATA.json | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14
