name: Continuous integration

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit being qualified for a native build
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  python:
    name: Python and Qt tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check optional uv development configuration
        run: |
          python scripts/sync_uv_dependencies.py --check
          python -m pip install uv==0.11.8
          uv lock --check
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libportaudio2 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon-x11-0 xauth xvfb
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt -r requirements-build.txt \
            -c requirements-release-constraints.txt
          python -m pip check
      - name: Check Python correctness and unused code
        run: |
          python -m pip install ruff==0.16.4
          python -m ruff check --select F .
      - name: Run test suite with a hard hang guard
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 20m xvfb-run -a python -m pytest -v --durations=20 -o faulthandler_timeout=120

  windows-updater:
    name: Windows updater and OpenCode regression tests
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runtime
        shell: pwsh
        run: |
          python -m venv venv
          . .\venv\Scripts\Activate.ps1
          python -m pip install -r requirements.txt -r requirements-build.txt -c requirements-release-constraints.txt
      - name: Run updater and controller tests
        shell: pwsh
        run: |
          . .\venv\Scripts\Activate.ps1
          python -m pytest tests/test_app_update.py tests/test_app_update_apply.py tests/test_app_update_dialog.py tests/test_app_update_handoff.py tests/test_updater_helper.py tests/test_update_startup_gate.py tests/test_update_resilience.py tests/test_application_controller.py tests/test_bootstrap.py -q

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Check OpenCode SDK adapter
        working-directory: sidecar-opencode
        shell: pwsh
        run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test
      - name: Build and verify the Windows OpenCode component
        shell: pwsh
        run: |
          . .\venv\Scripts\Activate.ps1
          python scripts/build_component.py meeting-agent-opencode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest tests/test_opencode_sidecar.py tests/test_meeting_sidecar.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-component-windows
          path: dist/components/meeting-agent-opencode-*
          if-no-files-found: error

  desktop-core:
    name: Core lifecycle (${{ matrix.os }}, ${{ matrix.dependencies }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            dependencies: release
            python: "3.12"
          - os: macos-14
            dependencies: release
            python: "3.12"
          - os: windows-2022
            dependencies: source
            python: "3.11"
          - os: macos-14
            dependencies: source
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install native macOS audio library
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Install pinned release environment
        if: matrix.dependencies == 'release'
        run: python -m pip install -r requirements.txt -r requirements-build.txt -c requirements-release-constraints.txt
      - name: Install documented source dependencies without release constraints
        if: matrix.dependencies == 'source'
        run: python -m pip install -r requirements.txt pytest
      - run: python -m pip check
      - name: Run cross-platform recording, cancellation and persistence regressions
        timeout-minutes: 10
        run: >-
          python -m pytest -q -o faulthandler_timeout=90
          tests/test_recorder.py tests/test_recorder_postroll.py
          tests/test_recording_journal.py tests/test_isolated_cancellation.py
          tests/test_recording_isolation.py tests/test_audio_processor.py
          tests/test_cancel_after_stop.py tests/test_batch_upload.py
          tests/test_streaming_transcriber.py tests/test_preview_lazy_tail.py
          tests/test_history_scalability.py tests/test_recording_retention.py
          tests/test_database.py tests/test_release_health.py tests/test_diagnostics.py
          tests/test_main_entrypoint.py tests/test_controller_thread_hops.py
          tests/test_application_controller.py tests/test_incremental_dictation.py
          tests/test_paste_latency.py
          tests/test_backup.py tests/test_backup_startup.py tests/test_backup_manager.py
          tests/test_backup_record_sync.py tests/test_settings_backup.py
          tests/test_meeting_recovery.py tests/test_meeting_capture_health.py
          tests/test_meeting_recovery_ui.py tests/test_meeting_spool.py
          tests/test_meeting_asr.py tests/test_meeting_remote.py
          tests/test_meeting_delivery_cursor.py tests/test_remote_host_admission.py
          tests/test_remote_engine.py tests/test_client_history.py
      - name: Gate lifecycle timing and process exit in a fresh process
        run: python scripts/check_release_health.py --output release-health.json --timeout 45
      - name: Preserve environment and timing evidence
        if: always()
        run: python -m pip freeze > installed-dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-health-${{ matrix.os }}-${{ matrix.dependencies }}
          path: |
            release-health.json
            installed-dependencies.txt
          retention-days: 14

  webui:
    name: Dashboard tests, typecheck and bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - working-directory: webui
        run: npm ci
      - working-directory: webui
        run: npm test
      - working-directory: webui
        run: npm run build
      - name: Require the committed dashboard bundle to match its source
        run: |
          changes=$(git status --porcelain --untracked-files=all -- webui/dist)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo '::error::Dashboard bundle is stale. Run cd webui && npm ci && npm run build, then commit all webui/dist changes (including new and deleted assets).'
            exit 1
          fi

  sidecar:
    name: Meeting sidecar checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - working-directory: sidecar
        run: npm ci
      - working-directory: sidecar
        run: npm run typecheck
      - working-directory: sidecar
        run: npm test
