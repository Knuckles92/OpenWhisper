name: Rune desktop · Linux, Windows, macOS

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/rune-*']
    paths: ['native/**', 'services/**', 'meeting/**', 'transcriber/**', 'config.py', 'main.py', 'requirements-native.txt', 'requirements-release-constraints.txt', 'scripts/*rune*', 'tests/native/**', '.github/workflows/rune-desktop.yml']
  pull_request:
    paths: ['native/**', 'services/**', 'meeting/**', 'transcriber/**', 'config.py', 'main.py', 'requirements-native.txt', 'requirements-release-constraints.txt', 'scripts/*rune*', 'tests/native/**', '.github/workflows/rune-desktop.yml']

permissions:
  contents: read

concurrency:
  group: rune-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native package · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPENWHISPER_DESKTOP_RUNTIME: native
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-native.txt
            requirements-release-constraints.txt
      - name: Linux desktop and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers libportaudio2 xvfb xauth xclip wl-clipboard dbus-x11 sway
      - name: Install native service dependencies without Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-native.txt -c requirements-release-constraints.txt pyinstaller pytest
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('PyQt6') is None, 'Native CI must not have Qt installed'"
      - name: Update Rust
        run: rustup update stable --no-self-update
      - name: Native Rust tests
        run: cargo test --release --locked --manifest-path native/Cargo.toml
      - name: Clipboard ownership tests
        run: python -m pytest --confcutdir=tests/native tests/native -v
      - name: Real native clipboard · Windows and macOS
        if: runner.os != 'Linux'
        env:
          OPENWHISPER_TEST_OS_CLIPBOARD: '1'
        run: python -m pytest --confcutdir=tests/native tests/native/test_clipboard.py -v
      - name: Real X11 clipboard and desktop session-bus controls
        if: runner.os == 'Linux'
        run: OPENWHISPER_TEST_X11=1 OPENWHISPER_TEST_SESSION_BUS=1 dbus-run-session -- xvfb-run -a python -m pytest --confcutdir=tests/native tests/native -v
      - name: Build independently launchable desktop and audio service
        run: python scripts/build_rune_desktop.py
      - name: Real Wayland multi-MIME clipboard and ownership tests
        if: runner.os == 'Linux'
        run: python scripts/test_rune_wayland.py
      - name: Relocated frozen package smoke · Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- xvfb-run -a python scripts/smoke_rune_package.py dist/rune/*.tar.gz
      - name: Relocated frozen package smoke · macOS
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/smoke_rune_package.py dist/rune/*.tar.gz
      - name: Relocated frozen package smoke · Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/rune/*.zip | Select-Object -ExpandProperty FullName
          python scripts/smoke_rune_package.py $archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openwhisper-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/rune/*.tar.gz
            dist/rune/*.zip
          if-no-files-found: error
          retention-days: 14
